<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piazza Beretta | Appartamento tipo</title>
<meta name="description" content="Piazza Beretta, Corbetta: pianta e vista interna di un appartamento tipo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  .ix { display: grid; grid-template-columns: 330px 1fr; }
  /* ---- the navy band, as in the reference */
  .ix-band {
    position: relative; z-index: 5; display: flex; flex-direction: column; min-height: 0; overflow: auto;
    color: #fff; text-align: center; scrollbar-width: thin;
    background: linear-gradient(180deg, #0a3c70 0%, #062a52 38%, #031a33 70%, #000a14 100%);
    border-right: 1px solid rgba(255,255,255,.08);
  }
  .ix-band > * { flex-shrink: 0; }
  .ix-band .mono { width: 78px; height: 78px; margin: 34px auto 0; }
  .ix-band .stem { width: 1px; height: 46px; background: #c8902f; margin: 12px auto 0; opacity: .9; }
  .ix-code { font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: .02em; margin-top: 36px; }
  .ix-rule { width: 200px; height: 1px; background: rgba(255,255,255,.85); margin: 10px auto 10px; }
  .ix-typo { font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
  .ix-also { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-top: 10px; padding: 0 22px; line-height: 1.5; }
  .ix-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 26px 20px 0; text-align: left; }
  .ix-kpis div { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); padding: 8px 10px; }
  .ix-kpis b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
  .ix-kpis span { font-family: var(--f-mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .ix-modes { display: grid; grid-template-columns: 1fr 1fr; margin: 18px 20px 0; border: 1px solid rgba(255,255,255,.28); border-radius: 4px; overflow: hidden; }
  .ix-modes button { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.7); padding: 9px 6px; }
  .ix-modes button[aria-pressed="true"] { background: #53e2cf; color: #001018; }
  .ix-rooms { margin: 18px 20px 0; display: grid; gap: 1px; text-align: left; }
  .ix-rooms button { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 3px; font-size: 12.5px; color: #fff; text-align: left; }
  .ix-rooms button:hover, .ix-rooms button[data-on="true"] { background: rgba(255,255,255,.08); }
  .ix-rooms i { width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 35%, transparent); }
  .ix-rooms small { font-family: var(--f-mono); font-size: 10.5px; color: rgba(255,255,255,.65); }
  .ix-acts { display: grid; gap: 8px; margin: 20px 20px 0; }
  .ix-acts a { display: block; padding: 9px 10px; border: 1px solid rgba(255,255,255,.35); font-family: "Montserrat", sans-serif; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
  .ix-acts a.main { background: #96764A; border-color: #96764A; }
  .ix-acts a:hover { border-color: #fff; }
  .ix-note { font-size: 10.5px; line-height: 1.5; color: rgba(255,255,255,.5); margin: 16px 22px 0; }
  .ix-foot { margin-top: auto; padding: 28px 0 22px; font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 11px; color: #DB9421; }
  /* ---- stage */
  .ix-stage { position: relative; min-width: 0; }
  .ix-top { position: absolute; z-index: 6; top: 14px; right: 14px; display: flex; gap: 8px; }
  .ix-top .b3d-btn, .ix-top .b3d-seg { background: var(--panel); backdrop-filter: var(--panel-filter); }
  .ix-close { width: 34px; height: 34px; display: grid !important; place-items: center; padding: 0 !important; }
  .ix-cart { position: absolute; z-index: 4; top: 16px; left: 22px; display: grid; gap: 4px; padding-left: 10px; border-left: 1px solid var(--line-strong);
    font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); pointer-events: none; }
  .ix-cart b { color: var(--ink); font-weight: 500; }
  .ix-cart em { font-style: normal; color: var(--r-high); }
  .ix-scale { position: absolute; z-index: 4; left: 22px; bottom: 18px; font-family: var(--f-mono); font-size: 10px; color: var(--mute); pointer-events: none; }
  .ix-scale span { display: block; height: 6px; border: 1px solid var(--mute); border-top: 0; margin-bottom: 4px; background: linear-gradient(90deg, var(--mute) 50%, transparent 50%) bottom / 100% 2px no-repeat; }
  .ix-hint { position: absolute; z-index: 4; bottom: 18px; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; pointer-events: none; }
  .ix-entry { translate: -50% -50%; width: 30px; height: 30px; border-radius: 50%; background: var(--signal); color: var(--on-signal); display: grid !important; place-items: center; box-shadow: 0 0 0 4px var(--signal-veil); }
  .ix-entry svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; }
  .ix-dim { translate: -50% -50%; font-family: var(--f-mono); font-size: 10px; color: var(--mute); background: color-mix(in srgb, var(--o-bg) 85%, transparent); padding: 1px 4px; border-radius: 2px; white-space: nowrap; }
  .ix-label { translate: -50% -50%; display: grid; justify-items: center; font-size: 11.5px; font-weight: 500; line-height: 1.2; color: var(--label-ink); text-align: center; white-space: nowrap; text-shadow: 0 0 3px var(--o-bg), 0 0 6px var(--o-bg); }
  .ix-label small { font-family: var(--f-mono); font-size: 10px; color: var(--c); }
  .ix[data-mode="inside"] .ix-label { background: var(--label-bg); padding: 3px 8px 4px; border-radius: 3px; border-left: 2px solid var(--c); text-shadow: none; box-shadow: 0 4px 18px var(--shadow); pointer-events: auto; cursor: pointer; }
  .ix-here { position: absolute; z-index: 4; top: 16px; left: 22px; padding: 6px 10px; border-left: 2px solid var(--signal); background: var(--label-bg); color: var(--label-ink); box-shadow: 0 4px 18px var(--shadow); display: none; }
  .ix-here small { display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .ix-here b { font-family: var(--f-display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
  .ix-map { position: absolute; z-index: 4; right: 14px; bottom: 14px; width: 230px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: var(--panel-filter); display: none; cursor: crosshair; }
  .ix-map svg { display: block; width: 100%; height: auto; }
  .ix[data-mode="inside"] .ix-here, .ix[data-mode="inside"] .ix-map { display: block; }
  .ix[data-mode="inside"] .ix-cart, .ix[data-mode="inside"] .ix-scale { display: none; }
  .ix-chips { position: absolute; z-index: 4; left: 22px; right: 270px; bottom: 16px; display: none; flex-wrap: wrap; gap: 6px; }
  .ix[data-mode="inside"] .ix-chips { display: flex; }
  .ix-chips button { padding: 5px 10px !important; border: 1px solid var(--line-strong) !important; border-radius: 999px; background: var(--panel) !important; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink) !important; }
  .ix-chips button[aria-pressed="true"] { border-color: var(--signal) !important; color: var(--signal) !important; }
  .ix[data-mode="inside"] .ix-hint { bottom: auto; top: 18px; }
  @media (max-width: 760px) {
    .ix { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .ix-band { max-height: 42vh; text-align: left; }
    .ix-band .mono, .ix-band .stem, .ix-rule, .ix-foot, .ix-note { display: none; }
    .ix-code { margin: 14px 16px 0; font-size: 22px; }
    .ix-typo { margin: 2px 16px 0; font-size: 13px; }
    .ix-also { padding: 0 16px; text-align: left; }
    .ix-kpis, .ix-modes, .ix-rooms, .ix-acts { margin-left: 16px; margin-right: 16px; }
    .ix-acts { grid-template-columns: 1fr 1fr; padding-bottom: 16px; }
    .ix-map { width: 150px; }
    .ix-chips { right: 180px; }
    .ix-hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ix" class="b3d ix" data-tema="scuro" data-mode="plan">
  <aside class="ix-band" id="band"></aside>
  <section class="ix-stage b3d-stage" id="stage" role="img" aria-label="Pianta e vista interna dell'appartamento">
    <div class="ix-cart" id="cart"></div>
    <div class="ix-here" id="here"><small>Sei in</small><b id="hereName"></b></div>
    <div class="b3d-overlay" id="overlay"></div>
    <div class="ix-scale" id="scale"><span id="scaleBar"></span><em id="scaleTxt"></em></div>
    <div class="ix-chips" id="chips"></div>
    <div class="ix-map" id="map" title="Clicca per spostarti"></div>
    <p class="ix-hint" id="hint"></p>
    <div class="ix-top">
      <div class="b3d-seg" role="group" aria-label="Tema" id="themes">
        <button type="button" data-theme="scuro" title="Silhouette"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        <button type="button" data-theme="chiaro" title="Gesso"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      </div>
      <a class="b3d-btn ix-close" id="close" href="../#planimetrie" title="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>
  </section>
</div>
<script type="module" src="interno.js"></script>
</body>
</html>
